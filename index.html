<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced PulseCounter</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:16px;
    padding-bottom:80px;
    font-family:Arial,sans-serif;
    background:#ffffff;
    color:#000000;
}

body.dark-mode{
    background:#111111;
    color:#eeeeee;
}

.logo{
    width:70px;
    height:auto;
    display:block;
    margin-bottom:8px;
}

h1{
    font-size:24px;
    font-weight:700;
    text-align:left;
    margin:0;
}

.subtitle{
    font-size:15px;
    margin-top:4px;
    margin-bottom:16px;
    opacity:.8;
}

.container{
    border:1px solid #d1d5db;
    border-radius:8px;
    padding:16px;
    background:#ffffff;
}

body.dark-mode .container{
    background:#1a1a1a;
    border-color:#444444;
}

.section{
    margin-bottom:18px;
}

.section-title{
    font-size:16px;
    font-weight:600;
    margin-bottom:8px;
}

.button-row{
    display:flex;
    gap:8px;
    margin-top:10px;
    margin-bottom:10px;
    flex-wrap:wrap;
}

button{
    padding:8px 12px;
    font-size:14px;
    font-weight:600;
    border:none;
    border-radius:6px;
    cursor:pointer;
    background:#007aff;
    color:#ffffff;
}

.secondary{
    background:#000000;
    color:#ffffff;
}

body.dark-mode .secondary{
    background:#444444;
}

.display-box{
    border:1px solid #d1d5db;
    border-radius:8px;
    padding:12px;
}

body.dark-mode .display-box{
    border-color:#444444;
}

.big-number{
    font-size:48px;
    font-weight:700;
    margin:10px 0;
}

.result{
    font-size:22px;
    font-weight:700;
    margin-top:8px;
}

.status{
    margin-top:6px;
}

.history{
    border-top:1px solid #d1d5db;
    padding-top:10px;
}

body.dark-mode .history{
    border-color:#444444;
}

.history-item{
    padding:10px 0;
    border-bottom:1px solid #d1d5db;
}

body.dark-mode .history-item{
    border-color:#444444;
}

.toggle{
    margin-top:20px;
    cursor:pointer;
    font-size:14px;
}

.footer{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    background:#ffffff;
    border-top:1px solid #d1d5db;
    padding:10px 12px;
}

body.dark-mode .footer{
    background:#1a1a1a;
    border-color:#444444;
}

.buy-button{
    display:block;
    width:100%;
    text-align:center;
    text-decoration:none;
    background:#000000;
    color:#ffffff;
    padding:12px;
    border-radius:8px;
    font-weight:600;
}
</style>
</head>

<body>

IMG_1741.jpeg

<h1>Advanced PulseCounter</h1>

<div class="subtitle">
    Vital Signs Assistant
</div>

<div class="container">

    <div class="section">
        <div class="section-title">Mode</div>

        <div class="button-row">
            <button onclick="setMode('Pulse')">Pulse</button>
            <button onclick="setMode('Respiration')">Respiration</button>
            <button onclick="setMode('Custom')">Custom</button>
        </div>
    </div>

    <div class="section">
        <div class="section-title">Duration</div>

        <div class="button-row">
            <button onclick="setDuration(15)">15 Seconds</button>
            <button onclick="setDuration(30)">30 Seconds</button>
            <button onclick="setDuration(60)">60 Seconds</button>
        </div>
    </div>

    <div class="display-box">

        <div id="modeDisplay">
            Mode: Pulse
        </div>

        <div id="durationDisplay">
            Duration: 15 Seconds
        </div>

        <div id="count" class="big-number">
            0
        </div>

        <div id="seconds">
            Seconds: 0
        </div>

        <div id="rate" class="result">
            Rate: 0
        </div>

        <div id="status" class="status">
            Status: Waiting
        </div>

    </div>

    <div class="section">

        <div class="button-row">
            <button id="plus">+1 Count</button>
            <button id="stop" class="secondary">Stop</button>
        </div>

        <div class="button-row">
            <button id="reset" class="secondary">Reset</button>
        </div>

        <div class="button-row">
            <button id="save">Save Reading</button>
        </div>

    </div>

    <div class="section">
        <div class="section-title">Reading History</div>

        <div id="history" class="history">
            No saved readings yet.
        </div>
    </div>

    <div class="toggle" onclick="toggleDarkMode()">
        Toggle Dark Mode
    </div>

</div>

<div class="footer" id="buyFooter">
    #
        Buy This Tool
    </a>
</div>

<script>

let mode = "Pulse";
let duration = 15;

let count = 0;
let seconds = 0;

let timer = null;
let timerStarted = false;
let timerFrozen = false;

const userOwnsTool = false;

if(userOwnsTool){
    document.getElementById("buyFooter").style.display = "none";
}

const countEl = document.getElementById("count");
const secondsEl = document.getElementById("seconds");
const rateEl = document.getElementById("rate");
const statusEl = document.getElementById("status");

function setMode(selected){

    mode = selected;

    document.getElementById("modeDisplay").textContent =
        "Mode: " + mode;

    updateRate();
}

function setDuration(value){

    duration = value;

    document.getElementById("durationDisplay").textContent =
        "Duration: " + duration + " Seconds";

    updateRate();
}

function startTimer(){

    timer = setInterval(() => {

        if(timerFrozen){
            return;
        }

        seconds++;

        secondsEl.textContent =
            "Seconds: " + seconds;

        if(seconds >= duration){

            timerFrozen = true;

            clearInterval(timer);

            statusEl.textContent =
                "Status: Measurement Complete";

            document.getElementById("plus").disabled = true;
        }

    },1000);
}

function interpret(value){

    if(mode === "Pulse"){

        if(value < 60){
            return "Low";
        }

        if(value <= 100){
            return "Typical Adult Range";
        }

        return "Elevated";
    }

    if(mode === "Respiration"){

        if(value < 12){
            return "Low";
        }

        if(value <= 20){
            return "Typical Adult Range";
        }

        return "Elevated";
    }

    return "Recorded";
}

function updateRate(){

    let calculatedRate =
        Math.round((count * 60) / duration);

    rateEl.textContent =
        "Rate: " + calculatedRate;

    statusEl.textContent =
        "Status: " + interpret(calculatedRate);
}

document.getElementById("plus").addEventListener("click", () => {

    if(timerFrozen){
        return;
    }

    if(!timerStarted){

        timerStarted = true;

        startTimer();
    }

    count++;

    countEl.textContent = count;

    updateRate();
});

document.getElementById("stop").addEventListener("click", () => {

    timerFrozen = true;

    clearInterval(timer);

    statusEl.textContent =
        "Status: Measurement Stopped";
});

document.getElementById("reset").addEventListener("click", () => {

    clearInterval(timer);

    count = 0;
    seconds = 0;

    timerStarted = false;
    timerFrozen = false;

    countEl.textContent = "0";

    secondsEl.textContent =
        "Seconds: 0";

    rateEl.textContent =
        "Rate: 0";

    statusEl.textContent =
        "Status: Waiting";

    document.getElementById("plus").disabled = false;
});

document.getElementById("save").addEventListener("click", () => {

    let rate = Math.round(
        (count * 60) / duration
    );

    const reading = {
        mode:mode,
        rate:rate,
        time:new Date().toLocaleString()
    };

    let history =
        JSON.parse(
            localStorage.getItem("pulseHistory")
        ) || [];

    history.unshift(reading);

    history = history.slice(0,50);

    localStorage.setItem(
        "pulseHistory",
        JSON.stringify(history)
    );

    renderHistory();
});

function renderHistory(){

    const container =
        document.getElementById("history");

    let history =
        JSON.parse(
            localStorage.getItem("pulseHistory")
        ) || [];

    if(history.length === 0){

        container.textContent =
            "No saved readings yet.";

        return;
    }

    container.innerHTML = "";

    history.forEach(item => {

        const div =
            document.createElement("div");

        div.className =
            "history-item";

        div.innerHTML =
            "<strong>" + item.rate + "</strong><br>" +
            item.mode + "<br>" +
            item.time;

        container.appendChild(div);
    });
}

function toggleDarkMode(){

    document.body.classList.toggle(
        "dark-mode"
    );
}

renderHistory();

</script>

</body>
</html>
