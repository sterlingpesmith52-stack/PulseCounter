<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>PulseCounter</title>

    <style>
        :root {
            --bg-light: #f7f7f7;
            --bg-dark: #111;
            --text-light: #222;
            --text-dark: #eee;
            --panel-light: #ffffff;
            --panel-dark: #1a1a1a;
            --border-light: #ccc;
            --border-dark: #444;
            --button-blue: #0078d4;
            --button-blue-dark: #005a9e;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, sans-serif;
            background: var(--bg-light);
            color: var(--text-light);
        }

        body.dark-mode {
            background: var(--bg-dark);
            color: var(--text-dark);
        }

        /* MICROFOUNDARY HEADER */
        .mf-header {
            display: flex;
            flex-direction: column;      /* logo above title */
            align-items: flex-start;     /* left aligned */
            padding: 16px 20px 0 20px;
        }

        .mf-logo {
            height: 32px;                /* smaller logo */
            width: auto;
            margin-bottom: 4px;          /* small gap before title */
        }

        .mf-title {
            font-size: 24px;             /* MicroFoundary standard */
            font-weight: 600;
            margin: 0;
            padding: 0;
            text-align: left;
        }

        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            background: var(--panel-light);
            border-radius: 10px;
            border: 1px solid #ddd;
        }

        body.dark-mode .container {
            background: var(--panel-dark);
            border: 1px solid #333;
        }

        #seconds {
            font-size: 22px;
            margin-bottom: 12px;
            text-align: left;
        }

        #count {
            font-size: 48px;
            font-weight: 600;
            margin-bottom: 12px;
            text-align: left;
        }

        #bpm {
            font-size: 22px;
            margin-bottom: 20px;
            text-align: left;
        }

        .button-row {
            display: flex;
            flex-direction: row;
            gap: 10px;
            justify-content: flex-start;
        }

        button {
            display: inline-block;
            width: auto;
            padding: 10px 16px;
            font-size: 17px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            background: var(--button-blue);
            color: white;
            -webkit-text-size-adjust: 100%;
        }

        #stop, #reset {
            background: #666;
        }

        body.dark-mode button {
            background: var(--button-blue-dark);
        }

        body.dark-mode #stop,
        body.dark-mode #reset {
            background: #555;
        }

        .toggle {
            margin-top: 20px;
            text-align: left;
            cursor: pointer;
            font-size: 14px;
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <!-- MICROFOUNDARY HEADER -->
    <div class="mf-header">
        <img src="IMG_1741.jpeg" class="mf-logo">
        <h1 class="mf-title">PulseCounter</h1>
    </div>

    <div class="container">
        <div id="seconds">Seconds: 0</div>
        <div id="count">0</div>
        <div id="bpm">BPM: 0</div>

        <div class="button-row">
            <button id="plus">+1</button>
            <button id="stop">Stop</button>
            <button id="reset">Reset</button>
        </div>

        <div class="toggle" id="toggle">Toggle Dark Mode</div>
    </div>

    <script>
        let seconds = 0;
        let beats = 0;
        let lastBeatTime = null;
        let timerStarted = false;
        let timerInterval = null;
        let timerFrozen = false;

        const secondsEl = document.getElementById("seconds");
        const countEl = document.getElementById("count");
        const bpmEl = document.getElementById("bpm");

        function startTimer() {
            timerInterval = setInterval(() => {
                seconds++;
                secondsEl.textContent = "Seconds: " + seconds;
            }, 1000);
        }

        document.getElementById("plus").addEventListener("click", () => {
            if (timerFrozen) return;

            if (!timerStarted) {
                timerStarted = true;
                startTimer();
            }

            beats++;
            countEl.textContent = beats;

            if (lastBeatTime !== null) {
                const diff = seconds - lastBeatTime;
                if (diff > 0) {
                    const bpm = Math.round(60 / diff);
                    bpmEl.textContent = "BPM: " + bpm;
                }
            }

            lastBeatTime = seconds;
        });

        document.getElementById("stop").addEventListener("click", () => {
            if (timerInterval) clearInterval(timerInterval);
            timerFrozen = true;
        });

        document.getElementById("reset").addEventListener("click", () => {
            seconds = 0;
            beats = 0;
            lastBeatTime = null;
            timerStarted = false;
            timerFrozen = false;

            clearInterval(timerInterval);
            timerInterval = null;

            secondsEl.textContent = "Seconds: 0";
            countEl.textContent = "0";
            bpmEl.textContent = "BPM: 0";
        });

        document.getElementById("toggle").addEventListener("click", () => {
            document.body.classList.toggle("dark-mode");
        });
    </script>
</body>
</html>
