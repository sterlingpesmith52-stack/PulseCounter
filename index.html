<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>PulseCounter</title>

    <style>
        :root {
            --bg-light: #ffffff;
            --bg-dark: #111;
            --text-light: #222;
            --text-dark: #eee;
            --panel-light: #ffffff;
            --panel-dark: #1a1a1a;
            --border-light: #ccc;
            --border-dark: #444;
            --button-blue: #0078d4;
            --button-blue-dark: #005a9e;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, sans-serif;
            background: var(--bg-light);
            color: var(--text-light);
        }

        body.dark-mode {
            background: var(--bg-dark);
            color: var(--text-dark);
        }

        /* MICROFOUNDARY HEADER */
        .mf-header {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 16px 20px 0 20px;
        }

        .mf-logo {
            height: 32px;
            width: auto;
            margin-bottom: 4px;
        }

        .mf-title {
            font-size: 24px;
            font-weight: 600;
            margin: 0;
            padding: 0;
            text-align: left;
        }

        .container {
            max-width: 600px;
            margin: 20px auto 100px auto; /* space above fixed footer */
            padding: 20px;
            background: var(--panel-light);
            border-radius: 10px;
            border: 1px solid #ddd;
        }

        body.dark-mode .container {
            background: var(--panel-dark);
            border: 1px solid #333;
        }

        #seconds {
            font-size: 22px;
            margin-bottom: 12px;
            text-align: left;
        }

        #count {
            font-size: 48px;
            font-weight: 600;
            margin-bottom: 12px;
            text-align: left;
        }

        #bpm {
            font-size: 22px;
            margin-bottom: 20px;
            text-align: left;
        }

        .button-row {
            display: flex;
            flex-direction: row;
            gap: 10px;
            justify-content: flex-start;
        }

        button {
            display: inline-block;
            width: auto;
            padding: 10px 16px;
            font-size: 17px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            background: var(--button-blue);
            color: white;
            -webkit-text-size-adjust: 100%;
        }

        #stop, #reset {
            background: #666;
        }

        body.dark-mode button {
            background: var(--button-blue-dark);
        }

        body.dark-mode #stop,
        body.dark-mode #reset {
            background: #555;
        }

        .toggle {
            margin-top: 20px;
            text-align: left;
            cursor: pointer;
            font-size: 14px;
            opacity: 0.8;
        }

        /* FIXED BUY FOOTER */
        .buy-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--panel-light);
            border-top: 1px solid var(--border-light);
            padding: 14px 20px;
            display: flex;
            justify-content: flex-start;
        }

        body.dark-mode .buy-footer {
            background: var(--panel-dark);
            border-top: 1px solid var(--border-dark);
        }

        .buy-btn {
            background: var(--button-blue);
            color: white;
            padding: 10px 16px;
            font-size: 17px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        body.dark-mode .buy-btn {
            background: var(--button-blue-dark);
        }
    </style>
</head>

<body>

    <!-- MICROFOUNDARY HEADER -->
    <div class="mf-header">
        <img src="IMG_1741.jpeg" class="mf-logo">
        <h1 class="mf-title">PulseCounter</h1>
    </div>

    <div class="container">
        <div id="seconds">Seconds: 0</div>
        <div id="count">0</div>
        <div id="bpm">BPM: 0</div>

        <div class="button-row">
            <button id="plus">+1</button>
            <button id="stop">Stop</button>
            <button id="reset">Reset</button>
        </div>

        <div class="toggle" id="toggle">Toggle Dark Mode</div>
    </div>

    <!-- FIXED BUY FOOTER -->
    <div id="buyFooter" class="buy-footer">
        <button class="buy-btn">Buy This Tool</button>
    </div>

    <script>
        let seconds = 0;
        let beats = 0;
        let lastBeatTime = null;
        let timerStarted = false;
        let timerInterval = null;
        let timerFrozen = false;

        const secondsEl = document.getElementById("seconds");
        const countEl = document.getElementById("count");
        const bpmEl = document.getElementById("bpm");

        /* OWNERSHIP LOGIC */
        const userOwnsTool = false; // change dynamically later
        const buyFooter = document.getElementById("buyFooter");
        if (userOwnsTool) {
            buyFooter.style.display = "none";
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                seconds++;
                secondsEl.textContent = "Seconds: " + seconds;
            }, 1000);
        }

        document.getElementById("plus").addEventListener("click", () => {
            if (timerFrozen) return;

            if (!timerStarted) {
                timerStarted = true;
                startTimer();
            }

            beats++;
            countEl.textContent = beats;

            if (lastBeatTime !== null) {
                const diff = seconds - lastBeatTime;
                if (diff > 0) {
                    const bpm = Math.round(60 / diff
